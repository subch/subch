name: Check the Commander table

# The site is static, so the page cannot tell on its own whether the table at
# mtg.subch.us is up. This job asks every few minutes and commits the answer
# as a small JSON file that /mtg reads.
#
# The table is Manabrew on the Forge engine, behind Caddy and a Discord gate.
# /gate/health is the gate's health endpoint and is deliberately ungated, so it
# answers 200 whenever Caddy and the gate are alive - which is the front door
# a player would hit first. A deeper check (relay, engine) needs a login and is
# not worth the noise here.
#
# The gate serves under /gate/* rather than /auth/*: Manabrew's own client owns
# /auth/callback for hub sign-in, and the two collided while the gate held that
# prefix.

on:
  schedule:
    # Every 5 minutes. GitHub queues cron jobs on a best-effort basis, so a run
    # can be several minutes late - the page accounts for that.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mtg-status
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HOST: mtg.subch.us
      URL: https://mtg.subch.us/gate/health
    steps:
      - uses: actions/checkout@v4

      - name: Probe the table
        id: probe
        run: |
          set -uo pipefail
          up=false
          if curl -fsS --max-time 10 "$URL" >/dev/null 2>&1; then
            up=true
          fi
          echo "up=$up" >> "$GITHUB_OUTPUT"
          echo "Table ${URL} up=$up"

      - name: Write status.json
        run: |
          set -euo pipefail
          mkdir -p public/mtg
          jq -n \
            --argjson up ${{ steps.probe.outputs.up }} \
            --arg host "$HOST" \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{up: $up, host: $host, checkedAt: $checkedAt}' \
            > public/mtg/status.json
          cat public/mtg/status.json

      - name: Commit when the answer changed
        run: |
          set -euo pipefail
          # Ignore checkedAt when deciding whether anything changed, otherwise
          # this would commit every five minutes forever and republish the site
          # each time.
          if git diff --quiet -- public/mtg/status.json; then
            echo "No change."; exit 0
          fi
          old=$(git show HEAD:public/mtg/status.json 2>/dev/null | jq -S 'del(.checkedAt)' || echo 'null')
          new=$(jq -S 'del(.checkedAt)' public/mtg/status.json)
          if [ "$old" = "$new" ]; then
            echo "Only the timestamp moved; not committing."
            git checkout -- public/mtg/status.json
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mtg/status.json
          git commit -m "MTG: table $( [ "${{ steps.probe.outputs.up }}" = "true" ] && echo up || echo down )"
          git push
